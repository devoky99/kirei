# Baut und testet bei jedem Push auf iOS und macOS.
# Öffentliches Repo: die macOS-Rechner von GitHub sind dafür kostenlos.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS und macOS
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Bauen und testen
        run: |
          set -o pipefail
          scripts/test-all.sh 2>&1 | tee build.log

      # Fehler, Warnungen und Testzahl als Anmerkungen am Commit.
      - name: Ergebnisse anzeigen
        if: always()
        run: python3 scripts/ci-annotate.py build.log

      # Prüft, ob die Vision-Analyse auf dem Rechner läuft. Bricht den Build nicht ab,
      # weil virtuelle Maschinen nicht alle Rechenwerke eines echten Macs haben.
      - name: Vision-Selbsttest
        if: success()
        continue-on-error: true
        run: |
          set -o pipefail
          swift run -c release --package-path Packages/Pruefstand kirei-pruefstand selbsttest 2>&1 | tee selbsttest.log

      - name: Selbsttest anzeigen
        if: always()
        run: |
          if [ -f selbsttest.log ]; then python3 scripts/ci-annotate.py --notice "Vision-Selbsttest" selbsttest.log; fi
